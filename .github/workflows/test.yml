name: Behavioral tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow reuses these checks and the packed tarball they upload.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:native
      - run: npm test
        env:
          CVLD_WRITE_PUBLIC_FIXTURE: /tmp/cvld-admission-v1.json
      - run: cat /tmp/cvld-admission-v1.json
      - run: npm pack --dry-run
  packed-consumer:
    needs: [test, browser-prf]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare stable Rust for generated package assets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Build holder assets and verify the complete packed consumer
        env:
          CVLD_RELEASE_DIR: ${{ runner.temp }}/cvld-release
          ARTIFACT_ROOT: ${{ runner.temp }}/cvld-release/holder-build
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          capture() {
            result=$?
            trap - EXIT
            printf '%s\n' "$result" > "$CVLD_RELEASE_DIR/validation-status.txt"
            (cd "$CVLD_RELEASE_DIR"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit "$result"
          }
          trap capture EXIT
          rustc --version > "$ARTIFACT_ROOT/rustc-version.txt"
          timeout --kill-after=15 1500 bash .ci/prepare-holder.sh 2>&1 | tee "$ARTIFACT_ROOT/build.log"
          timeout --kill-after=15 300 node test/package-consumer.js 2>&1 | tee "$CVLD_RELEASE_DIR/consumer.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cmtymeet-cvld-npm-${{ github.sha }}
          path: ${{ runner.temp }}/cvld-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  browser-prf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node test/browser-prf.js
