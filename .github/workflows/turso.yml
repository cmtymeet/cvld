name: Turso and asynchronous entry stores
on:
  workflow_dispatch:
    inputs:
      resolve_dependencies:
        description: Resolve the new SDK in the retained npm lock
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  durable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify supported SDK stores and entry contracts
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/turso-entry
          RESOLVE_DEPENDENCIES: ${{ inputs.resolve_dependencies && '1' || '0' }}
        run: bash .ci/turso-checks.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: turso-entry-${{ github.sha }}
          path: ${{ runner.temp }}/turso-entry
          if-no-files-found: error
          retention-days: 7
