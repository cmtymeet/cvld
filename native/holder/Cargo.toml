[package]
name = "cvld-holder"
version = "0.1.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Prepared from the exact upstream revision by the shared CI source step.
anoncreds = { path = "../../.ci/dependencies/anoncreds-rs", default-features = false, features = ["zeroize", "w3c"] }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
